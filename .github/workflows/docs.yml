name: Deploy Docs

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label for all jobs (default: ubuntu-24.04)'
        required: false
        type: string
        default: 'ubuntu-24.04'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read
      pages: write
      id-token: write
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ${{ inputs.runs-on }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Linux Compatibility

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label for all jobs (default: ubuntu-24.04)'
        required: false
        type: string
        default: 'ubuntu-24.04'
      install-command:
        description: 'Command to install dependencies (default: npm ci)'
        required: false
        type: string
        default: 'npm ci'
      node-versions:
        description: 'JSON array of Node.js versions to test (default: [20, 22, 24])'
        required: false
        type: string
        default: '[20, 22, 24]'

jobs:
  build-and-test:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
